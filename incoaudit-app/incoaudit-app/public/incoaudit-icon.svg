<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="squircle">
      <rect x="0" y="0" width="512" height="512" rx="112" ry="112"/>
    </clipPath>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="#16261F"/>

  <g clip-path="url(#squircle)">
    <!-- faint ledger rule lines for texture -->
    <g stroke="#FAF8F2" stroke-opacity="0.05" stroke-width="2">
      <line x1="0" y1="120" x2="512" y2="120"/>
      <line x1="0" y1="392" x2="512" y2="392"/>
    </g>

    <!-- shield -->
    <path d="M256 96
             C 300 120, 344 130, 380 130
             L 380 262
             C 380 350, 322 406, 256 438
             C 190 406, 132 350, 132 262
             L 132 130
             C 168 130, 212 120, 256 96 Z"
          fill="#1F6F5C" stroke="#FAF8F2" stroke-opacity="0.35" stroke-width="5"/>

    <!-- ascending income bars -->
    <rect x="182" y="298" width="34" height="66" rx="6" fill="#FAF8F2"/>
    <rect x="228" y="262" width="34" height="102" rx="6" fill="#FAF8F2"/>
    <rect x="274" y="214" width="34" height="150" rx="6" fill="#F3E9D3"/>

    <!-- verified / audit badge -->
    <circle cx="360" cy="152" r="46" fill="#B98A2E" stroke="#16261F" stroke-width="7"/>
    <path d="M338 152 L353 167 L384 130" fill="none" stroke="#FAF8F2"
          stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
